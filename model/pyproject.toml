[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarmind-ilmenite"
version = "0.1.0"
description = "Reproducible M³ spectral baseline for lunar ilmenite mapping"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "scipy>=1.12,<2",
  "pvl>=1.3,<2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4,<2", "xgboost>=2,<4"]
dev = ["jupyterlab>=4,<5", "ruff>=0.6,<1"]

[project.scripts]
lunarmind-inspect-label = "lunarmind.inspect_pds:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
